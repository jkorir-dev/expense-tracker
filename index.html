<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Global Expense Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="auth-overlay" class="auth-overlay">
  <div class="auth-card">
    <h2 id="auth-title">Welcome to Expense Tracker</h2>
    <form id="auth-form">
      <div class="form-group">
        <label for="auth-email">Email Address</label>
        <input type="email" id="auth-email" placeholder="name@domain.com" required>
      </div>
      <div class="form-group">
        <label for="auth-password">Password</label>
        <input type="password" id="auth-password" placeholder="••••••••" required>
      </div>
      <button type="submit" id="auth-submit-btn" class="btn-primary">Log In</button>
    </form>
    <p class="auth-toggle-text">
      <span id="auth-toggle-msg">Don't have an account?</span> 
      <a href="#" id="auth-toggle-link">Sign Up</a>
    </p>
  </div>
</div>

  <div class="app-container">
    <header>
      <h1>Multi-Currency Expense Tracker</h1>
      <div class="global-controls">
        <div class="control-group">
          <label for="home-currency">Home Currency:</label>
          <input type="text" id="home-currency" list="currency-list" value="USD">
        </div>
      </div>
    </header>

    <div id="status-message" class="status-message hidden"></div>

    <main class="main-content">
      <section class="form-section">
        <h2>Log New Expense</h2>
        <form id="expense-form">
          <div class="form-group">
            <label for="exp-desc">Description</label>
            <input type="text" id="exp-desc" placeholder="e.g., Coffee, Train Ticket" required>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="exp-amount">Amount</label>
              <input type="number" id="exp-amount" step="0.01" min="0.01" placeholder="0.00" required>
            </div>
            <div class="form-group">
              <label for="exp-currency">Currency</label>
              <input type="text" id="exp-currency" list="currency-list" placeholder="USD" required>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="exp-date">Date of Purchase</label>
              <input type="date" id="exp-date" required>
            </div>
            <div class="form-group">
              <label for="exp-category">Category</label>
              <select id="exp-category">
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Shopping">Shopping</option>
                <option value="Entertainment">Entertainment</option>
              </select>
            </div>
          </div>
          <button type="submit" class="btn-primary">Add Expense</button>
        </form>
      </section>

      <section class="ledger-section">
        <div class="ledger-header">
          <h2>Expenses Ledger</h2>
          <div class="filter-group">
            <label for="filter-category">Filter:</label>
            <select id="filter-category">
              <option value="All">All Categories</option>
              <option value="Food">Food</option>
              <option value="Transport">Transport</option>
              <option value="Shopping">Shopping</option>
              <option value="Entertainment">Entertainment</option>
            </select>
          </div>
        </div>

        <div class="table-wrapper">
          <table class="expense-table">
            <thead>
              <tr>
                <th>Date</th>
                <th>Description</th>
                <th>Category</th>
                <th>Original Price</th>
                <th>Converted Value</th>
              </tr>
            </thead>
            <tbody id="expense-list">
            </tbody>
          </table>
        </div>

        <div class="summary-card">
          <h3>Total Aggregated Spending</h3>
          <p id="total-display" class="total-amount">0.00 USD</p>
        </div>
      </section>
    </main>
  </div>

  <datalist id="currency-list"></datalist>

  <script type="module" src="src/main.js"></script>
</body>
</html>
